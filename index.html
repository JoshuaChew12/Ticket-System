<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>Ticket Sales System</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="app">

  <header class="app-header">
    <h1>Ticket Sales</h1>
    <p>Ticket Management System</p>
  </header>

  <main class="app-content">

    <section class="card">
      <h2>System Status</h2>
      <div id="systemStatus" class="status">
        Connecting...
      </div>
    </section>

    <section class="card">
      <h2>Select Ticket</h2>

      <div class="ticket-input">
        <input
          id="ticketNumber"
          type="number"
          inputmode="numeric"
          placeholder="Enter ticket number"
        >

        <button id="findTicketBtn">
          Find
        </button>
      </div>

      <div
        id="ticketResult"
        class="ticket-result hidden">
      </div>
    </section>

    <section
      id="selectedSection"
      class="card hidden">

      <h2>Selected Books</h2>

      <div id="selectedBooks"></div>

    </section>

  </main>

  <div
    id="selectionSummary"
    class="selection-summary hidden">

    <div class="summary-content">

      <div>
        <small>Books</small>
        <strong id="selectedBookCount">0</strong>
      </div>

      <div>
        <small>Tickets</small>
        <strong id="selectedTicketCount">0</strong>
      </div>

      <div>
        <small>Total</small>
        <strong id="selectedTotalAmount">
          RM0
        </strong>
      </div>

    </div>

    <button id="continueBtn"
            class="primary-button"
            disabled>
      Continue
    </button>

  </div>

</div>

<script src="js/api.js"></script>
<script src="js/tickets.js"></script>
<script src="js/app.js"></script>

</body>
</html>
